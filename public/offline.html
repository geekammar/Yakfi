<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>غير متصل — يكفي</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          "IBM Plex Sans Arabic",
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f7fb;
        color: #122a43;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #16171d;
          color: #ecedf2;
        }
      }
      main {
        text-align: center;
        padding: 24px;
        max-width: 24rem;
      }
      h1 {
        font-size: 1.125rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.875rem;
        opacity: 0.7;
        margin: 0;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تحقق من اتصالك ثم أعد تحميل الصفحة للمتابعة.</p>
    </main>
  </body>
</html>
