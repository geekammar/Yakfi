name: Test DB Migration Validation

on:
  pull_request:
    paths:
      - "prisma/**"
      - ".github/workflows/test-db-migrate.yml"
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: validate-migrations
        options:
          - validate-migrations
          - diagnose-credential
          - repair-credential
          - switch-webhook-dry-run
          - switch-webhook-apply
          - restore-main-webhook-preflight
          - restore-main-webhook-dry-run
          - restore-main-webhook-apply
      expected_commit_sha:
        type: string
        required: false
        description: Full reviewed SHA, required for credential and webhook operations

permissions:
  contents: read

concurrency:
  group: test-db-migration-shared-singleton
  cancel-in-progress: false

jobs:
  validate-migrations:
    name: Validate pending Prisma migrations (disposable test DB)
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'validate-migrations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request ref
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Fail closed if TEST_DATABASE_URL is missing
        shell: bash
        run: |
          if [ -z "${{ secrets.TEST_DATABASE_URL }}" ]; then
            echo "::error::TEST_DATABASE_URL secret is not configured. Migration validation fails closed to prevent unverified schema changes from entering main."
            exit 1
          fi

      - name: Pre-migration status check
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        shell: bash
        run: |
          set +e
          # Neon pooler endpoints use PgBouncer in transaction mode which does not support session advisory locks cleanly.
          # Prisma Migrate documentation requires a direct connection: strip '-pooler.' to connect directly.
          MIGRATE_URL="${DATABASE_URL/-pooler./.}"
          DATABASE_URL="$MIGRATE_URL" pnpm exec prisma migrate status > status-pre.raw.txt 2>&1
          sed -E 's#(postgres(ql)?://)[^@]+@#\1***:***@#g' status-pre.raw.txt > status-pre.txt
          echo "### Pre-migration status (test DB)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat status-pre.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat status-pre.txt
          if grep -qiE 'up to date|have not yet been applied' status-pre.txt; then
            exit 0
          fi
          echo '::error::prisma migrate status could not read the test database — aborting'
          exit 1

      - name: Apply migrations to test database
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        shell: bash
        run: |
          set +e
          MIGRATE_URL="${DATABASE_URL/-pooler./.}"
          for attempt in 1 2 3; do
            DATABASE_URL="$MIGRATE_URL" pnpm db:deploy > deploy.raw.txt 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              break
            fi
            if grep -q 'P1002' deploy.raw.txt && [ "$attempt" -lt 3 ]; then
              echo "Advisory lock contention detected (P1002). Retrying in 5s (attempt $attempt/3)..."
              sleep 5
              continue
            fi
            break
          done
          sed -E 's#(postgres(ql)?://)[^@]+@#\1***:***@#g' deploy.raw.txt > deploy.txt
          echo "### Migration deploy output (test DB)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat deploy.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat deploy.txt
          exit "$code"

      - name: Post-migration status verification
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        shell: bash
        run: |
          set +e
          MIGRATE_URL="${DATABASE_URL/-pooler./.}"
          DATABASE_URL="$MIGRATE_URL" pnpm exec prisma migrate status > status-post.raw.txt 2>&1
          sed -E 's#(postgres(ql)?://)[^@]+@#\1***:***@#g' status-post.raw.txt > status-post.txt
          echo "### Post-migration status (test DB)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat status-post.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat status-post.txt
          if grep -qi 'Database schema is up to date' status-post.txt; then
            echo '✅ Test migration validated: schema is up to date'
            exit 0
          fi
          echo '::error::Post-migration status on test DB does not report up to date'
          exit 1

  recover-test-credential:
    name: Diagnose or repair fixed test bot credential
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/fix/safe-telegram-staff-reply-delivery' &&
      (inputs.operation == 'diagnose-credential' || inputs.operation == 'repair-credential')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exact reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo '::error::Reviewed SHA missing or mismatched; refusing credential operation.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install reviewed locked dependencies without secrets
        run: pnpm install --frozen-lockfile
      - name: Diagnose or repair without exporting the master key
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          CREDENTIAL_MASTER_KEY: ${{ secrets.CREDENTIAL_MASTER_KEY }}
          TEST_BOT_TOKEN: ${{ secrets.YAKFI_TEST_CUSTOMER_BOT_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$CREDENTIAL_MASTER_KEY" ]; then
            echo '::error::Required test database or master key secret is unavailable.'
            exit 1
          fi
          if [ "$OPERATION" = 'repair-credential' ]; then
            if [ -z "$TEST_BOT_TOKEN" ]; then
              echo '::error::Set YAKFI_TEST_CUSTOMER_BOT_TOKEN using masked GitHub secret input.'
              exit 1
            fi
            python3 scripts/repair-test-bot-credential.py --from-environment --apply
          else
            python3 scripts/repair-test-bot-credential.py --from-environment
          fi

  switch-test-webhook:
    name: Switch customer bot webhook to Preview (guarded)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/fix/safe-telegram-staff-reply-delivery' &&
      (inputs.operation == 'switch-webhook-dry-run' || inputs.operation == 'switch-webhook-apply')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exact reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo '::error::Reviewed SHA missing or mismatched; refusing webhook switch operation.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install reviewed locked dependencies without secrets
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Execute guarded customer webhook switch
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          CREDENTIAL_MASTER_KEY: ${{ secrets.CREDENTIAL_MASTER_KEY }}
          OPERATION: ${{ inputs.operation }}
        run: |
          node --import tsx scripts/switch-test-bot-webhook.ts

  restore-main-webhook:
    name: Restore customer bot webhook to Production (guarded prepare-only)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/fix/safe-telegram-staff-reply-delivery' &&
      (inputs.operation == 'restore-main-webhook-preflight' || inputs.operation == 'restore-main-webhook-dry-run' || inputs.operation == 'restore-main-webhook-apply')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exact reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo '::error::Reviewed SHA missing or mismatched; refusing webhook restoration operation.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install reviewed locked dependencies without secrets
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Execute guarded customer webhook restoration (prepare-only)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RESTORE_BOT_TOKEN: ${{ secrets.YAKFI_TEST_CUSTOMER_BOT_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: |
          node --import tsx scripts/switch-test-bot-webhook.ts
