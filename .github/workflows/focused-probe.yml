name: Focused probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: Focused disclosure checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run focused checks
        run: |
          set +e
          for cmd in \
            check:ai-disclosure \
            check:turn-evidence \
            check:ai-readiness \
            check:service-price \
            check:business-identity-generative \
            check:greeting \
            check:semantic-authority-repair
          do
            echo "::group::pnpm $cmd"
            pnpm "$cmd"
            echo "EXIT_CODE=$? for $cmd"
            echo "::endgroup::"
          done
