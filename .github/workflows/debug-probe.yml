name: Debug Probe

on:
  push:
    branches:
      - integration/staff-delivery-knowledge-contract
    paths:
      - .github/workflows/debug-probe.yml

permissions:
  contents: read

jobs:
  debug:
    name: Run focused maintenance regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install reviewed locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Run focused maintenance regression
        run: pnpm check:telegram-repair-workflow
