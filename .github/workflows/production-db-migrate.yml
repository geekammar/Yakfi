name: Production DB Migration

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA whose migrations are applied"
        required: false
        default: "main"
      expected_db_host:
        description: "Exact host that must match PRODUCTION_DATABASE_URL"
        required: true
        type: string
      expected_commit_sha:
        description: "Exact reviewed commit SHA whose migrations are applied"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending Prisma migrations (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Require exact reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
        shell: bash
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo '::error::Full reviewed commit SHA is missing or malformed; refusing runtime migration.'
            exit 1
          fi
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo '::error::Expected reviewed SHA does not match the checked-out commit; refusing runtime migration.'
            exit 1
          fi

      - name: Record source commit
        shell: bash
        run: |
          {
            echo "## Production database migration"
            echo ""
            echo "- selected ref: \`${{ inputs.ref }}\`"
            echo "- expected database host: \`${{ inputs.expected_db_host }}\`"
            echo "- resolved commit: \`$(git rev-parse HEAD)\`"
            echo "- started: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='Checked out %H%n%an  %ad%n%s'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify selected runtime database target
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EXPECTED_DB_HOST: ${{ inputs.expected_db_host }}
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo '::error::PRODUCTION_DATABASE_URL secret is unavailable; aborting before any change.'
            exit 1
          fi
          if [ -z "$EXPECTED_DB_HOST" ]; then
            echo '::error::expected_db_host is required; aborting before any change.'
            exit 1
          fi
          ACTUAL_DB_HOST=$(node -e 'try { const u = new URL(process.env.DATABASE_URL || ""); process.stdout.write(u.hostname); } catch { process.exit(1); }') || {
            echo '::error::PRODUCTION_DATABASE_URL is not a valid database URL; aborting before any change.'
            exit 1
          }
          if [ "$ACTUAL_DB_HOST" != "$EXPECTED_DB_HOST" ]; then
            echo "::error::Database target mismatch. expected_db_host does not match PRODUCTION_DATABASE_URL; aborting before any change."
            exit 1
          fi
          # The old Production database is preserved as inactive recovery data.
          # Runtime migrations never target it after the single-runtime cutover.
          for legacy_host in \
            "ep-tiny-grass-a5e63jev.us-east-2.aws.neon.tech" \
            "ep-tiny-grass-a5e63jev-pooler.us-east-2.aws.neon.tech"; do
            if [ "$ACTUAL_DB_HOST" = "$legacy_host" ]; then
              echo '::error::Legacy Production database host is inactive; refusing runtime migration.'
              exit 1
            fi
          done
          echo "Verified runtime database host: $ACTUAL_DB_HOST"

      - name: Pre-migration status
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          set +e
          pnpm exec prisma migrate status > status-pre.raw.txt 2>&1
          sed -E 's#(postgres(ql)?://)[^@]+@#\1***:***@#g' status-pre.raw.txt > status-pre.txt
          echo "### Pre-migration status" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat status-pre.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat status-pre.txt
          if grep -qiE 'up to date|have not yet been applied' status-pre.txt; then
            exit 0
          fi
          echo '::error::prisma migrate status could not read the production database — aborting before any change'
          exit 1

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          set +e
          pnpm db:deploy > deploy.raw.txt 2>&1
          code=$?
          sed -E 's#(postgres(ql)?://)[^@]+@#\1***:***@#g' deploy.raw.txt > deploy.txt
          echo "### Migration deploy output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat deploy.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat deploy.txt
          exit "$code"

      - name: Post-migration status
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          set +e
          pnpm exec prisma migrate status > status-post.raw.txt 2>&1
          sed -E 's#(postgres(ql)?://)[^@]+@#\1***:***@#g' status-post.raw.txt > status-post.txt
          echo "### Post-migration status" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat status-post.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat status-post.txt
          if grep -qi 'Database schema is up to date' status-post.txt; then
            echo '✅ Post-migration status: schema is up to date'
            exit 0
          fi
          echo '::error::Post-migration status does not report "Database schema is up to date" — investigate before touching the database again'
          exit 1

      - name: Migration succeeded
        if: success()
        shell: bash
        run: |
          {
            echo "### Result"
            echo ""
            echo "✅ **PROD_MIGRATION_COMPLETE** — pending migrations applied to production; schema reports up to date."
            echo "- finished: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Migration failed
        if: failure()
        shell: bash
        run: |
          {
            echo "### Result"
            echo ""
            echo "❌ **MIGRATION_FAILED** — no recovery action was taken. Do not edit committed migrations, do not use db push/reset. Inspect the masked output above and re-run only after the cause is resolved."
          } >> "$GITHUB_STEP_SUMMARY"
