name: Production DB Migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-db-migrate
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only inspection of Production DB connection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Read-only Production DB connection preflight
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: node scripts/ops-check-prod-connection.mjs
