name: Production Runtime Environment Cutover

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: preflight
        options:
          - preflight
          - apply
      expected_commit_sha:
        type: string
        required: true
        description: Full reviewed SHA for this exact cutover source

permissions:
  contents: read

concurrency:
  group: production-runtime-env
  cancel-in-progress: false

jobs:
  update-runtime-env:
    name: Update only Production DATABASE_URL and CREDENTIAL_MASTER_KEY
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/integration/staff-delivery-knowledge-contract' ||
      github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exact reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo '::error::Full reviewed SHA is missing or malformed; refusing Production environment update.'
            exit 1
          fi
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo '::error::Reviewed SHA mismatched with checked-out SHA; refusing Production environment update.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install reviewed locked dependencies without secrets
        run: pnpm install --frozen-lockfile
      - name: Preflight or apply the fixed Production runtime pair
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          CREDENTIAL_MASTER_KEY: ${{ secrets.CREDENTIAL_MASTER_KEY }}
          OPERATION: ${{ inputs.operation }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node --import tsx scripts/update-production-runtime-env.ts
