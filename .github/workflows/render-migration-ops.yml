name: Render Secret Recovery & Allowlisted Transfer (Manual Only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual operation (never runs in PR CI)"
        required: true
        type: choice
        default: "inspect-sources"
        options:
          - "inspect-sources"
          - "export-encrypted-bundle"
          - "transfer-to-render"
      expected_commit_sha:
        description: "Exact 40-char reviewed commit SHA matching checked-out ref"
        required: true
        type: string
      render_service_id:
        description: "Confirmed Render web service ID in My Workspace (srv-...)"
        required: false
        type: string
        default: ""
      owner_recipient:
        description: "Owner-controlled X25519 public recipient (yakfi-rcpt-v1:...)"
        required: false
        type: string
        default: ""
      allowlist:
        description: "Comma-separated subset of allowlisted keys (DATABASE_URL,CREDENTIAL_MASTER_KEY)"
        required: false
        type: string
        default: "DATABASE_URL,CREDENTIAL_MASTER_KEY"
      dry_run:
        description: "Keep true for preflight; set false ONLY for reviewed Render transfer"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: render-migration-ops-singleton
  cancel-in-progress: false

jobs:
  recovery-and-transfer:
    name: Guarded Render Recovery / Transfer (${{ inputs.mode }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require exact reviewed 40-char commit SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo '::error::expected_commit_sha must be a full 40-character lowercase hex SHA.'
            exit 1
          fi
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo '::error::expected_commit_sha does not match checked-out SHA; refusing secret operation.'
            exit 1
          fi

      - name: Checkout exact reviewed commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install locked dependencies without secrets
        run: pnpm install --frozen-lockfile

      - name: Execute values-free source inspection
        if: inputs.mode == 'inspect-sources'
        env:
          TEST_DATABASE_URL_SOURCE: ${{ secrets.TEST_DATABASE_URL }}
          PROD_DATABASE_URL_SOURCE: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CREDENTIAL_MASTER_KEY_SOURCE: ${{ secrets.CREDENTIAL_MASTER_KEY }}
          VERCEL_TOKEN_SOURCE: ${{ secrets.VERCEL_TOKEN }}
          RENDER_API_KEY_SOURCE: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ inputs.render_service_id }}
        run: pnpm exec tsx scripts/render-vault-tool.ts inspect-sources

      - name: Export owner-encrypted recovery bundle (ciphertext only)
        if: inputs.mode == 'export-encrypted-bundle'
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          GITHUB_SHA: ${{ github.sha }}
          RENDER_SERVICE_ID: ${{ inputs.render_service_id }}
          OWNER_RECIPIENT: ${{ inputs.owner_recipient }}
          ALLOWLIST: ${{ inputs.allowlist }}
          TEST_DATABASE_URL_SOURCE: ${{ secrets.TEST_DATABASE_URL }}
          CREDENTIAL_MASTER_KEY_SOURCE: ${{ secrets.CREDENTIAL_MASTER_KEY }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/yakfi-encrypted-out
          chmod 700 /tmp/yakfi-encrypted-out
          pnpm exec tsx scripts/render-vault-tool.ts export-encrypted-bundle \
            --bundle-out /tmp/yakfi-encrypted-out/yakfi-secrets.enc.json

      - name: Execute allowlisted transfer to confirmed Render service
        if: inputs.mode == 'transfer-to-render'
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          GITHUB_SHA: ${{ github.sha }}
          RENDER_SERVICE_ID: ${{ inputs.render_service_id }}
          RENDER_API_KEY_SOURCE: ${{ secrets.RENDER_API_KEY }}
          OWNER_RECIPIENT: ${{ inputs.owner_recipient }}
          ALLOWLIST: ${{ inputs.allowlist }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_DATABASE_URL_SOURCE: ${{ secrets.TEST_DATABASE_URL }}
          CREDENTIAL_MASTER_KEY_SOURCE: ${{ secrets.CREDENTIAL_MASTER_KEY }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/yakfi-encrypted-out
          chmod 700 /tmp/yakfi-encrypted-out
          pnpm exec tsx scripts/render-vault-tool.ts transfer-to-render \
            --bundle-out /tmp/yakfi-encrypted-out/yakfi-secrets.enc.json

      - name: Upload ciphertext-only owner bundle (1-day retention)
        if: >-
          success() &&
          (inputs.mode == 'export-encrypted-bundle' || inputs.mode == 'transfer-to-render')
        uses: actions/upload-artifact@v4
        with:
          name: yakfi-owner-encrypted-bundle
          path: /tmp/yakfi-encrypted-out/yakfi-secrets.enc.json
          retention-days: 1
          if-no-files-found: error

      - name: Remove temporary ciphertext file
        if: always()
        run: rm -rf /tmp/yakfi-encrypted-out
