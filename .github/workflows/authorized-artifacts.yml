name: Authorized Generated Artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate prompt artifact and format touched files
        run: |
          pnpm generate:ai-prompts
          pnpm exec prettier --write prompts/system/booking-assistant.prompt src/server/integrations/ai/prompt.ts src/features/conversations/server/ai-contract.ts src/features/conversations/server/ai-context-builder/context-builder.ts src/features/conversations/server/ai-disclosure/disclosure-gate.ts src/features/conversations/types.ts src/features/conversations/server/conversation-queries.ts src/features/conversations/lib/live-refresh.ts src/features/conversations/components/conversation-detail.tsx src/features/conversations/components/conversation-live-refresh.test.tsx src/features/conversations/server/conversation-refresh.test.tsx scripts/check-ai-disclosure.ts scripts/check-ai-provider.ts scripts/check-unknown-information-handoff.ts docs/BUILD_STATE.md docs/CURRENT_STATE.md docs/DECISIONS.md docs/DECISIONS_INDEX.md docs/ai/ARCHITECTURE.md package.json
      - name: Commit generated and formatted output
        run: |
          git config user.name "flowpilot-ci"
          git config user.email "flowpilot-ci@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate AI prompt artifact and apply formatter"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
