name: Format Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Generate Prettier patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install reviewed locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Prettier to the maintenance files
        run: |
          pnpm exec prettier --write scripts/check-telegram-repair-workflow.ts scripts/switch-test-bot-webhook.ts
          git diff --no-color > prettier.patch
          git diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-patch
          path: prettier.patch
          if-no-files-found: error
