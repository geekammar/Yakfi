name: Format Probe
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier diff
        run: |
          pnpm exec prettier --write src/features/conversations/lib/live-refresh.ts src/features/conversations/components/conversation-detail.tsx src/features/conversations/components/conversation-live-refresh.test.tsx
          git diff -- src/features/conversations/lib/live-refresh.ts src/features/conversations/components/conversation-detail.tsx src/features/conversations/components/conversation-live-refresh.test.tsx
