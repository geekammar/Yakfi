name: Format Probe

on:
  push:
    branches:
      - integration/staff-delivery-knowledge-contract
    paths:
      - .github/workflows/format-probe.yml

permissions:
  contents: read

jobs:
  format:
    name: Generate Prettier patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install reviewed locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Prettier to the corrected cutover files
        run: |
          pnpm exec prettier --write \
            .github/workflows/pr-validation.yml \
            .github/workflows/test-db-migrate.yml \
            docs/BUILD_STATE.md \
            docs/CURRENT_STATE.md \
            docs/ENVIRONMENT_VARIABLES.md \
            docs/GITHUB_WORKFLOW.md \
            docs/TROUBLESHOOTING.md \
            package.json \
            scripts/check-cutover-readiness.ts \
            scripts/check-telegram-repair-workflow.ts \
            scripts/check-update-production-runtime-env.ts \
            scripts/switch-test-bot-webhook.ts \
            scripts/update-production-runtime-env.ts \
            src/app/api/operator/cutover-readiness/route.ts \
            src/lib/public-paths.ts \
            src/server/operator/cutover-readiness.ts
          git diff --no-color > prettier.patch
          git diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-patch
          path: prettier.patch
          if-no-files-found: error
