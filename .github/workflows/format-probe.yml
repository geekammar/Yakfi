name: Format Probe

on:
  push:
    branches:
      - test/acceptance-evidence-ci
    paths:
      - .github/workflows/format-probe.yml

permissions:
  contents: read

jobs:
  format:
    name: Generate Prettier patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install reviewed locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Prettier to the changed files
        run: |
          pnpm exec prettier --write scripts/check-turn-evidence.ts
          git diff --no-color > prettier.patch
          git diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-patch
          path: prettier.patch
          if-no-files-found: error
