name: Temp Conversation Lab format

on:
  push:
    branches:
      - feat/conversation-lab-alignment

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: format conversation-lab files')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/conversation-lab-alignment
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Conversation Lab files
        run: >-
          pnpm exec prettier --write
          scripts/check-copy-lab.ts
          src/features/platform/components/copy-lab-detail.tsx
          src/features/platform/components/copy-lab-detail.test.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-copy-lab.ts src/features/platform/components/copy-lab-detail.tsx src/features/platform/components/copy-lab-detail.test.tsx
          git diff --cached --quiet || git commit -m "chore: format conversation-lab files"
          git push origin HEAD:feat/conversation-lab-alignment
