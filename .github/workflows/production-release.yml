name: Production Release & Post-Deploy Verification

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Explicit production hosting target (render or vercel)"
        required: true
        type: choice
        default: "render"
        options:
          - "render"
          - "vercel"
      production_base_url:
        description: "Exact HTTPS origin of the target deployment (e.g. https://yakfi.onrender.com)"
        required: true
        type: string
      expected_commit_sha:
        description: "Exact 40-char commit SHA deployed and verified on main"
        required: true
        type: string
      publish_release:
        description: "Create annotated tag and GitHub Release ONLY after live readiness + exact SHA pass"
        required: false
        type: boolean
        default: false
      force_tag:
        description: "Re-verify an already-tagged commit idempotently"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify-and-release:
    name: Verify Explicit Production Target & Publish Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 25
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract target release version and enforce exact reviewed SHA
        id: version-info
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_VERSION=$(node -e "try { console.log(require('./package.json').version || '') } catch(e) {}")
          if [ -z "$TARGET_VERSION" ] || ! [[ "$TARGET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid or missing SemVer version in package.json: '$TARGET_VERSION'"
            exit 1
          fi
          COMMIT_SHA=$(git rev-parse HEAD)
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::expected_commit_sha must be a full 40-character lowercase hex SHA."
            exit 1
          fi
          if [ "$EXPECTED_SHA" != "$COMMIT_SHA" ]; then
            echo "::error::expected_commit_sha ($EXPECTED_SHA) does not match main HEAD ($COMMIT_SHA). Refusing unverified release."
            exit 1
          fi
          TAG_NAME="v${TARGET_VERSION}"
          echo "target_version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "target_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Check if Git tag already exists
        id: check-tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version-info.outputs.target_tag }}"
          COMMIT="${{ steps.version-info.outputs.commit_sha }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            EXISTING_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')
            if [ -z "$EXISTING_TAG_SHA" ]; then
              EXISTING_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
            fi
            if [ "$EXISTING_TAG_SHA" = "$COMMIT" ]; then
              echo "already_tagged=true" >> "$GITHUB_OUTPUT"
              echo "✅ Tag $TAG already points to this exact commit. Proceeding with idempotent verification."
            elif [ "${{ inputs.force_tag }}" = "true" ]; then
              echo "::error::Tag $TAG already points to a different commit ($EXISTING_TAG_SHA). Releases are immutable even with force_tag."
              exit 1
            else
              echo "::error::Tag $TAG already exists on origin pointing to a different commit. Releases are immutable!"
              exit 1
            fi
          else
            echo "already_tagged=false" >> "$GITHUB_OUTPUT"
            echo "✅ Tag $TAG is free."
          fi

      - name: Verify live Production health, DB readiness & exact commit SHA
        id: verify-prod
        env:
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          PRODUCTION_BASE_URL: ${{ inputs.production_base_url }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          CHECKED_OUT_COMMIT_SHA: ${{ steps.version-info.outputs.commit_sha }}
          EXPECTED_VERSION: ${{ steps.version-info.outputs.target_version }}
        run: node scripts/verify-production-release.mjs

      - name: Create Git tag & publish GitHub Release
        if: >-
          steps.verify-prod.outputs.prod_verified == 'true' &&
          inputs.publish_release == true &&
          steps.check-tag.outputs.already_tagged != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_TARGET: ${{ steps.verify-prod.outputs.verified_target }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version-info.outputs.target_tag }}"
          COMMIT="${{ steps.version-info.outputs.commit_sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "🏷️ Tagging verified commit $COMMIT as $TAG..."
          git tag -a "$TAG" -m "FlowPilot $TAG — Production Release"
          git push origin "$TAG"

          echo "📢 Creating GitHub Release for $TAG..."
          gh release create "$TAG" \
            --title "FlowPilot $TAG" \
            --notes "Verified production release of commit \`${COMMIT}\` on target \`${VERIFIED_TARGET}\`." \
            --verify-tag

      - name: Production Release Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 🚀 FlowPilot Production Release Summary"
            echo ""
            echo "- **Target Platform**: \`${{ inputs.deployment_target }}\`"
            echo "- **Expected Commit SHA**: \`${{ inputs.expected_commit_sha }}\`"
            if [ "${{ steps.verify-prod.outputs.prod_verified }}" = "true" ]; then
              echo "- **Live Readiness & Exact SHA**: ✅ VERIFIED"
              echo "- **Version**: \`${{ steps.version-info.outputs.target_version }}\`"
              echo "- **Health Endpoint**: \`${{ steps.verify-prod.outputs.verified_health_url }}\`"
              if [ "${{ inputs.publish_release }}" = "true" ]; then
                echo "- **Tag / GitHub Release**: ✅ PUBLISHED (\`${{ steps.version-info.outputs.target_tag }}\`)"
              else
                echo "- **Tag / GitHub Release**: ℹ️ SKIPPED (\`publish_release=false\`, verification-only mode)"
              fi
            else
              echo "- **Status**: ❌ DEPLOYMENT VERIFICATION FAILED"
              echo "- **Tag / GitHub Release**: 🛑 BLOCKED (unverified candidates are never tagged or released)"
            fi
            echo "- **Timestamp**: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"
